<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Bingo Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Bingo</h1>
    <div class="subtitle">Click the tiles to mark them. Get a full row, column or diagonal.</div>

    <div class="status-row">
      <div class="status" id="statusText">
        Lines completed: <span id="linesCount">0</span>
      </div>
      <button id="newBoardBtn">
        🔄 New Board
      </button>
    </div>

    <div class="board" id="board"></div>

    <div class="bingo" id="bingoText">BINGO!</div>

    <div class="footer">
      Bingo version 1 – made by VIPIN 🧠💻
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
