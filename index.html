<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Bingo Game</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e5e7eb;
    }

    .container {
      background: #020617;
      border-radius: 20px;
      padding: 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    h1 {
      text-align: center;
      margin: 0 0 4px;
      font-size: 1.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .subtitle {
      text-align: center;
      font-size: 0.8rem;
      color: #9ca3af;
      margin-bottom: 16px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }

    .cell {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      border: 1px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      font-size: 1.1rem;
      font-weight: 600;
      background: radial-gradient(circle at top, #111827, #020617);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease, border-color 0.12s ease;
    }

    .cell:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.6);
      border-color: #4b5563;
    }

    .cell.marked {
      background: radial-gradient(circle at top, #16a34a, #064e3b);
      border-color: #22c55e;
      box-shadow: 0 8px 18px rgba(34,197,94,0.4);
      color: #ecfdf5;
    }

    .cell.free {
      background: radial-gradient(circle at top, #0ea5e9, #0369a1);
      border-color: #38bdf8;
      color: #e0f2fe;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .status {
      font-size: 0.9rem;
      color: #9ca3af;
    }

    .bingo {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #22c55e;
      opacity: 0;
      transform: scale(0.9);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .bingo.show {
      opacity: 1;
      transform: scale(1);
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 0.9rem;
      cursor: pointer;
      background: #1d4ed8;
      color: white;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.1s ease;
      box-shadow: 0 6px 12px rgba(59,130,246,0.5);
    }

    button:hover {
      background: #2563eb;
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(59,130,246,0.7);
    }

    button:active {
      transform: translateY(0px) scale(0.98);
      box-shadow: 0 3px 8px rgba(59,130,246,0.6);
    }

    .footer {
      text-align: center;
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bingo</h1>
    <div class="subtitle">Click the tiles to mark them. Get a full row, column or diagonal.</div>

    <div class="status-row">
      <div class="status" id="statusText">Lines completed: <span id="linesCount">0</span></div>
      <button id="newBoardBtn">
        🔄 New Board
      </button>
    </div>

    <div class="board" id="board"></div>

    <div class="bingo" id="bingoText">BINGO!</div>

    <div class="footer">
       Bingo version 1 – made by VIPIN 🧠💻
    </div>
  </div>

  <script>
    const boardEl = document.getElementById('board');
    const linesCountEl = document.getElementById('linesCount');
    const bingoTextEl = document.getElementById('bingoText');
    const newBoardBtn = document.getElementById('newBoardBtn');

    const SIZE = 5;
    let cells = []; // store DOM elements
    let marked = []; // 2D array of booleans

    // Generate array [1, 2, ..., 25] and shuffle
    function generateNumbers() {
      const nums = [];
      for (let i = 1; i <= SIZE * SIZE; i++) nums.push(i);
      for (let i = nums.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [nums[i], nums[j]] = [nums[j], nums[i]];
      }
      return nums;
    }

    function createBoard() {
      boardEl.innerHTML = '';
      cells = [];
      marked = Array.from({ length: SIZE }, () => Array(SIZE).fill(false));
      bingoTextEl.classList.remove('show');
      linesCountEl.textContent = '0';

      const nums = generateNumbers();
      let idx = 0;

      for (let row = 0; row < SIZE; row++) {
        cells[row] = [];
        for (let col = 0; col < SIZE; col++) {
          const cell = document.createElement('div');
          cell.classList.add('cell');
          cell.dataset.row = row;
          cell.dataset.col = col;

          const number = nums[idx++];
          cell.textContent = number;

          // Optional: make center cell a FREE space
         // if (row === 2 && col === 2) {
         //   cell.textContent = '★';
         //   cell.classList.add('free', 'marked'); 
         //   marked[row][col] = true;
          //}

          cell.addEventListener('click', () => {
            toggleCell(row, col);
          });

          boardEl.appendChild(cell);
          cells[row][col] = cell;
        }
      }

      updateLines();
    }

    function toggleCell(row, col) {
      // Don't allow clicking to unmark the free space icon if you want
      // You can comment this condition if you want it clickable
      if (row === 2 && col === 2) return;

      marked[row][col] = !marked[row][col];
      cells[row][col].classList.toggle('marked', marked[row][col]);
      updateLines();
    }

    function updateLines() {
      let lines = 0;

      // Rows
      for (let r = 0; r < SIZE; r++) {
        if (marked[r].every(v => v)) lines++;
      }

      // Columns
      for (let c = 0; c < SIZE; c++) {
        let colComplete = true;
        for (let r = 0; r < SIZE; r++) {
          if (!marked[r][c]) {
            colComplete = false;
            break;
          }
        }
        if (colComplete) lines++;
      }

      // Diagonal 1 (top-left to bottom-right)
      let diag1 = true;
      for (let i = 0; i < SIZE; i++) {
        if (!marked[i][i]) {
          diag1 = false;
          break;
        }
      }
      if (diag1) lines++;

      // Diagonal 2 (top-right to bottom-left)
      let diag2 = true;
      for (let i = 0; i < SIZE; i++) {
        if (!marked[i][SIZE - 1 - i]) {
          diag2 = false;
          break;
        }
      }
      if (diag2) lines++;

      linesCountEl.textContent = lines;

      if (lines > 0) {
        bingoTextEl.classList.add('show');
      } else {
        bingoTextEl.classList.remove('show');
      }
    }

    newBoardBtn.addEventListener('click', createBoard);

    // init
    createBoard();
  </script>
</body>
</html>
